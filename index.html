<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAVAVIPN PREMIUM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #ffd700; --dark-bg: #0a0a0a; --card-bg: #141414; }
        body { font-family: -apple-system, sans-serif; background-color: var(--dark-bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 90%; max-width: 400px; background: var(--card-bg); padding: 30px; border-radius: 30px; border: 1px solid rgba(255, 215, 0, 0.3); text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin: 0 0 5px 0; font-size: 24px; }
        .status-badge { background: rgba(255, 215, 0, 0.1); color: var(--gold); padding: 5px 15px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 25px; border: 1px solid var(--gold); }
        .main-btn { background: linear-gradient(45deg, #ffd700, #b8860b); color: black; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 25px; transition: 0.2s; }
        .main-btn:active { transform: scale(0.98); }
        .section-title { font-size: 14px; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        .app-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .app-btn { background: #1a1a1a; color: #fff; text-decoration: none; padding: 15px 5px; border-radius: 12px; font-size: 11px; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
        .app-btn:active { background: #333; }
        .app-btn b { color: var(--gold); font-size: 13px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DAVAVIPN</h1>
        <div class="status-badge">PREMIUM СЕРВЕР: АМСТЕРДАМ</div>
        
        <button class="main-btn" onclick="copyKey()">СКОПИРОВАТЬ КЛЮЧ</button>

        <div class="section-title">Установить приложение:</div>
        <div class="app-links">
            <a href="https://apps.apple.com/ru/app/v2box-v2ray-client/id6446814690" class="app-btn" target="_blank">
                <b>v2Box</b> для iOS
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.v2raytun.android" class="app-btn" target="_blank">
                <b>v2rayTun</b> для Android
            </a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function copyKey() {
            // Твой ключ доступа
            const vpnKey = "vless://user-id@5.129.238.111:443?encryption=none&security=reality#DAVAVIPN";
            
            navigator.clipboard.writeText(vpnKey).then(() => {
                tg.showPopup({
                    title: 'Готово!',
                    message: 'Ключ скопирован. Вставьте его в ваше приложение.',
                    buttons: [{type: 'ok'}]
                });
            });
        }
    </script>
</body>
</html>
