<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAVAVIPN PREMIUM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #ffd700;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: var(--gold);
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .status-badge {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 25px;
            border: 1px solid var(--gold);
        }
        .instruction {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .main-btn {
            background: linear-gradient(45deg, #ffd700, #b8860b);
            color: black;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        .main-btn:active {
            transform: scale(0.96);
        }
        .app-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .app-btn {
            background: #222;
            color: #ccc;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid #333;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DAVAVIPN</h1>
        <div class="status-badge">PREMIUM СЕРВЕР: АМСТЕРДАМ</div>
        
        <p class="instruction">Нажмите на кнопку ниже, чтобы скопировать ваш персональный ключ доступа</p>
        
        <button class="main-btn" onclick="copyKey()">СКОПИРОВАТЬ КЛЮЧ</button>

        <div class="app-links">
            <a href="https://play.google.com/store/apps/details?id=com.v2ray.ang" class="app-btn">Android App</a>
            <a href="https://apps.apple.com/us/app/v2box-v2ray-client/id6446814690" class="app-btn">iOS App</a>
        </div>

        <div class="footer-text">Powered by V2Ray Technology</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        function copyKey() {
            // Сюда потом вставишь свой реальный vless/ss ключ
            const dummyKey = "vless://your-id@5.129.238.111:443?encryption=none&security=reality#DAVAVIPN_USER";
            
            navigator.clipboard.writeText(dummyKey).then(() => {
                alert("Ключ успешно скопирован! Вставьте его в приложение.");
                tg.close(); // Закрыть мини-апп после копирования
            });
        }
    </script>
</body>
</html>
